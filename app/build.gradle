plugins {
    id 'com.android.application'
}

android {
    namespace 'com.swir.xadkiller'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.swir.xadkiller'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '1.6.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        // Each dynamic status receiver uses RECEIVER_NOT_EXPORTED on Android 13+
        // and the only available legacy overload below API 33. Current lint
        // flags the guarded pre-33 branch even though the flag API did not exist
        // there. Keep every other lint rule fatal; suppress only this reviewed
        // compatibility false-positive.
        disable 'UnspecifiedRegisterReceiverFlag'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

def xadLargeListQualification = project.findProperty('xadkillerLargeListQualification')?.toString()?.toBoolean() ?: false

tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    testLogging {
        events "passed", "failed", "skipped"
        showStandardStreams = true
        exceptionFormat "full"
    }
    if (xadLargeListQualification) {
        // Dedicated CI proof: production 750k parser + JUnit/Android stubs must fit in a
        // deliberately constrained worker heap. The test also checks the deterministic
        // LongCollector array-peak model against the current production source.
        maxHeapSize = '128m'
        systemProperty 'xadkiller.largeListQualification', 'true'
    }
}
