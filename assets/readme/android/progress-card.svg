<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">xADKiller Android progress — 58.3%</title>
  <desc id="desc">v1.6.0 development roadmap. Status HARDENING. Roadmap items: 7/12 verified. Development progress and release readiness are separate gates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02050A"/>
      <stop offset="1" stop-color="#07111C"/>
    </linearGradient>
    <linearGradient id="progressGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0088FF"/>
      <stop offset="1" stop-color="#62E5FF"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-80%" width="120%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#62E5FF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <clipPath id="trackClip"><rect x="50" y="138" width="1100" height="18" rx="9"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1198" height="178" rx="22" fill="url(#bg)" stroke="#62E5FF" stroke-opacity=".28" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="176" rx="21" fill="url(#grid)"/>
  <text x="50" y="31" fill="#62E5FF" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">SWIR PROGRESS</text>
  <text x="50" y="68" fill="#F4FAFF" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">xADKiller Android</text>
  <text x="50" y="96" fill="#8DA8B8" font-family="Segoe UI,Arial,sans-serif" font-size="15">v1.6.0 development roadmap</text>
  <rect x="935" y="25" width="215" height="34" rx="17" fill="#07111C" stroke="#0088FF" stroke-opacity=".75"/>
  <text x="1042.5" y="47" text-anchor="middle" fill="#62E5FF" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">HARDENING</text>
  <text x="50" y="122" fill="#8DA8B8" font-family="Segoe UI,Arial,sans-serif" font-size="13">Roadmap items: 7/12 verified</text>
  <text x="1150" y="122" text-anchor="end" fill="#F4FAFF" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">58.3%</text>
  <rect id="progress-track" x="50" y="138" width="1100" height="18" rx="9" fill="#0A1A28" stroke="#8DA8B8" stroke-opacity=".22"/>
  <rect id="progress-fill" x="50" y="138" width="641.666667" height="18" rx="9" fill="url(#progressGradient)" filter="url(#softGlow)" clip-path="url(#trackClip)"/>
  <text x="1150" y="171" text-anchor="end" fill="#8DA8B8" font-family="Segoe UI,Arial,sans-serif" font-size="10">Release readiness is tracked separately.</text>
</svg>
