<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">xADKiller Chrome v1.5 development</title>
  <desc id="desc">SWIR project banner for the xADKiller Chrome Manifest V3 ad and tracker blocker development line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02050A"/><stop offset="1" stop-color="#07111C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0088FF"/><stop offset="1" stop-color="#62E5FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#62E5FF" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
