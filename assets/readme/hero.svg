  <path d="M0 270 C240 210 360 305 600 238 S960 205 1200 118" fill="none" stroke="#0088FF" stroke-opacity=".23" stroke-width="2"/>
  <path d="M0 292 C250 235 420 320 650 258 S980 238 1200 150" fill="none" stroke="#62E5FF" stroke-opacity=".16" stroke-width="1.5"/>
  <g transform="translate(88 72)" filter="url(#glow)">
    <path d="M78 0 145 24v55c0 50-28 88-67 111C39 167 11 129 11 79V24Z" fill="#07111C" stroke="url(#accent)" stroke-width="5"/>
    <path d="M42 92 68 118 116 62" fill="none" stroke="#62E5FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="286" y="76" fill="#62E5FF" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="4">SWIR PROJECT</text>
  <text x="286" y="147" fill="#F4FAFF" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="800">xADKiller</text>
  <text x="289" y="194" fill="#8DA8B8" font-family="Segoe UI,Arial,sans-serif" font-size="25">Fast, privacy-focused ad &amp; tracker blocking</text>
