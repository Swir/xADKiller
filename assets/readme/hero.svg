  <text x="311" y="252" fill="#62E5FF" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">CHROME MV3 • v1.5 DEV • DATA-ONLY LIVE FEEDS</text>
