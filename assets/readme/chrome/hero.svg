<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">xADKiller Chrome — TITAN ad and tracker protection</title>
  <desc id="desc">SWIR project banner for the Chrome Manifest V3 xADKiller browser extension.</desc>
  <defs>
