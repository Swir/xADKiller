    <linearGradient id="electric" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0088FF"/><stop offset="1" stop-color="#62E5FF"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#62E5FF" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="27" fill="url(#grid)" stroke="#62E5FF" stroke-opacity=".25" stroke-width="2"/>
  <circle cx="169" cy="157" r="96" fill="#07111C" stroke="url(#electric)" stroke-width="6" filter="url(#glow)"/>
  <path d="M117 117h104v81H117z" fill="none" stroke="#62E5FF" stroke-width="8" rx="8"/>
  <path d="M118 140h102M151 117v-18h36v18" fill="none" stroke="#0088FF" stroke-width="7" stroke-linecap="round"/>
  <path d="M144 174l18 18 37-43" fill="none" stroke="#62E5FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="310" y="70" fill="#62E5FF" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4">SWIR PROJECT</text>
  <text x="310" y="135" fill="#F4FAFF" font-family="Segoe UI,Arial,sans-serif" font-size="58" font-weight="800">xADKiller Chrome</text>
  <text x="310" y="185" fill="#8DA8B8" font-family="Segoe UI,Arial,sans-serif" font-size="24">TITAN Manifest V3 ad &amp; tracker blocker</text>
