name: xADKiller Android large-list bounded-memory gate

on:
  workflow_dispatch:
  push:
    branches: [ android-v160-mega ]
    paths:
      - "app/build.gradle"
      - "app/src/main/java/com/swir/xadkiller/BlocklistManager.java"
      - "app/src/main/java/com/swir/xadkiller/AdBlockVpnServiceV121.java"
      - "app/src/test/java/com/swir/xadkiller/BlocklistLargeListQualificationTest.java"
      - ".github/workflows/android-large-list-memory.yml"

concurrency:
  group: xadkiller-android-large-list-memory-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bounded-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -perm -111 | sort -V | tail -n1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: 750k parser constrained-heap and off-main-thread qualification
        run: gradle --no-daemon testDebugUnitTest --tests com.swir.xadkiller.BlocklistLargeListQualificationTest -PxadkillerLargeListQualification=true
