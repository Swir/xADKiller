name: xADKiller Android v1.6 dashboard UX gate

on:
  workflow_dispatch:
  push:
    branches: [ android-v160-mega ]
    paths:
      - "app/src/main/java/com/swir/xadkiller/DashboardStatusModel.java"
      - "app/src/main/java/com/swir/xadkiller/MainActivityV121.java"
      - "app/src/main/java/com/swir/xadkiller/SmartEngineAccessGuide.java"
      - "app/src/main/res/values/colors.xml"
      - "app/src/test/java/com/swir/xadkiller/DashboardStatusModelTest.java"
      - "app/src/test/java/com/swir/xadkiller/SmartEngineAccessGuideTest.java"
      - ".github/workflows/android-dashboard-ux.yml"

concurrency:
  group: xadkiller-android-dashboard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dashboard-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -perm -111 | sort -V | tail -n1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Dashboard state and recovery priority regression
        run: gradle --no-daemon testDebugUnitTest --tests com.swir.xadkiller.DashboardStatusModelTest
      - name: Dashboard PL EN safe-recovery and premium UI contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/swir/xadkiller/MainActivityV121.java")
          text = path.read_text(encoding="utf-8")
          access_path = Path("app/src/main/java/com/swir/xadkiller/SmartEngineAccessGuide.java")
          access = access_path.read_text(encoding="utf-8")
          colors = Path("app/src/main/res/values/colors.xml").read_text(encoding="utf-8").upper()

          required_pairs = [
              ("STAN SYSTEMU • v1.6", "SYSTEM HEALTH • v1.6"),
              ("Zdrowe moduły: ", "Healthy modules: "),
              ("VPN: AKTYWNY", "VPN: ACTIVE"),
              ("DNS: konflikt STRICT Private DNS", "DNS: STRICT Private DNS conflict"),
              ("Listy: puste — recovery wymagane", "Lists: empty — recovery required"),
              ("Smart Engine: Accessibility wyłączone", "Smart Engine: Accessibility disabled"),
              ("NAPRAW: USTAWIENIA PRIVATE DNS", "FIX: PRIVATE DNS SETTINGS"),
              ("NAPRAW: URUCHOM VPN", "FIX: START VPN"),
              ("NAPRAW: ODŚWIEŻ LISTY", "FIX: REFRESH LISTS"),
              ("NAPRAW: WŁĄCZ SMART ENGINE", "FIX: ENABLE SMART ENGINE"),
          ]
          for pl, en in required_pairs:
              assert pl in text, f"missing PL dashboard copy: {pl}"
              assert en in text, f"missing EN dashboard copy: {en}"

          required_safe_actions = [
              "PrivateDnsHelper.settingsIntent()",
              "VpnService.prepare(this)",
              "BlocklistManager.updateRemote(getApplicationContext())",
              "SmartEngineAccessGuide.open(this)",
              "healthHandler.removeCallbacks(healthRefresh)",
              "I18n.language(this)",
          ]
          for token in required_safe_actions:
              assert token in text, f"dashboard safe-recovery contract missing: {token}"

          premium_ui_contract = [
              "applyPremiumSurfacePass()",
              "styleInteractiveTree",
              "GradientDrawable.Orientation.TL_BR",
              "setStroke",
              "setThumbTintList",
              "setTrackTintList",
              "R.color.swir_cyan",
              "setElevation",
          ]
          for token in premium_ui_contract:
              assert token in text, f"premium Android UI contract missing: {token}"

          for color in ("#02050A", "#07111C", "#0B1A29", "#0088FF", "#62E5FF"):
              assert color in colors, f"premium SWIR palette missing: {color}"

          restricted_access_contract = [
              "Settings.ACTION_ACCESSIBILITY_SETTINGS",
              "Settings.ACTION_APPLICATION_DETAILS_SETTINGS",
              "shouldOfferRestrictedSettingsHelp",
              "xADKiller cannot bypass this Android security gate.",
              "xADKiller nie może ominąć tej blokady systemowej.",
          ]
          for token in restricted_access_contract:
              assert token in access, f"Smart Engine restricted-settings recovery missing: {token}"

          assert "delete" not in text.lower() or "custom rules" in text.lower(), "dashboard recovery must not introduce silent destructive flow"
          assert "WRITE_SECURE_SETTINGS" not in access, "Smart Engine helper must not bypass Android restricted settings"
          print("Android v1.6 dashboard PL/EN + safe recovery + premium UI contract: PASS")
          PY
