name: xADKiller Android v1.6 qualification contract

on:
  workflow_dispatch:
  push:
    branches: [ android-v160-mega ]
    paths:
      - "ci/validate_android_v160_qualification.py"
      - "ci/validate_android_physical_witness.py"
      - "ci/validate_android_restart_witness.py"
      - "ci/validate_android_realapp_witness.py"
      - "ci/test_android_restart_powershell_contract.py"
      - "tools/android-v160-restart-validation.ps1"
      - ".github/workflows/android-v160-qualification-contract.yml"

concurrency:
  group: xadkiller-android-v160-qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualification-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python syntax
        run: |
          python3 -m py_compile \
            ci/validate_android_v160_qualification.py \
            ci/validate_android_physical_witness.py \
            ci/validate_android_restart_witness.py \
            ci/validate_android_realapp_witness.py \
            ci/test_android_restart_powershell_contract.py
      - name: Qualification provenance and gate self-test
        run: python3 ci/validate_android_v160_qualification.py --self-test
      - name: Windows restart witness contract
        run: python3 ci/test_android_restart_powershell_contract.py
      - name: Windows restart collector PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/android-v160-restart-validation.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "Android Windows restart witness PowerShell syntax: PASS"
      - name: Safety contract
        shell: bash
        run: |
          set -euo pipefail
          TOOL=ci/validate_android_v160_qualification.py
          grep -q 'qualification_review_ready' "$TOOL"
          grep -q 'release_gate_closed' "$TOOL"
          grep -q 'expected-commit' "$TOOL"
          grep -q 'apk_sha256' "$TOOL"
          grep -q 'MIN_RESTART_CYCLES = 3' "$TOOL"
          grep -q 'requested_handover' "$TOOL"
          grep -q 'requested_sleep_wake' "$TOOL"
          grep -q 'requested_idle' "$TOOL"
          grep -q 'requested_package_replace' "$TOOL"
          grep -q 'validate_android_physical_witness' "$TOOL"
          grep -q 'validate_android_restart_witness' "$TOOL"
          grep -q 'validate_android_realapp_witness' "$TOOL"
          ! grep -Eq '(^|[[:space:]])(import|from)[[:space:]]+(requests|urllib|socket)([[:space:].]|$)|\b(requests|urllib|socket)\.' "$TOOL"
          echo "Android v1.6 qualification remains local, provenance-bound and non-authorizing: PASS"
