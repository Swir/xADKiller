name: Test xADKiller Chrome TITAN

on:
  push:
    branches: [ chrome-titan-v140 ]
    paths:
      - "browser-extension/**"
      - ".github/workflows/chrome-ultra-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile static dynamic and TITAN session rules
        run: npm run build
      - name: Validate Chrome TITAN package
        run: npm run validate
      - name: JavaScript syntax
        run: |
          node --check dist/chrome/service-worker.js
          node --check dist/chrome/background.js
          node --check dist/chrome/live-signatures.js
          node --check dist/chrome/titan-engine.js
          node --check dist/chrome/titan-main.js
          node --check dist/chrome/network-scout.js
          node --check dist/chrome/early-guard.js
          node --check dist/chrome/preflight-config.js
          node --check dist/chrome/content.js
          node --check dist/chrome/shadow-sentinel.js
          node --check dist/chrome/live-cosmetic.js
          node --check dist/chrome/popup.js
          node --check dist/chrome/cosmetic-data.js
          node --check dist/chrome/build-meta.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium TITAN runtime test
        run: timeout --signal=TERM --kill-after=10s 300s npm run test:chrome
      - name: Package Chrome TITAN beta ZIP
        run: |
          rm -rf packages
          mkdir -p packages
          (cd dist/chrome && zip -qr ../../packages/xADKiller-Chrome-v1.4.0-TITAN-beta.zip .)
      - name: Checksums
        run: |
          cd packages
          sha256sum xADKiller-Chrome-v1.4.0-TITAN-beta.zip > SHA256SUMS.txt
      - name: Verify archive
        run: |
          unzip -tq packages/xADKiller-Chrome-v1.4.0-TITAN-beta.zip
          (cd packages && sha256sum -c SHA256SUMS.txt)
      - name: Upload tested Chrome TITAN beta
        uses: actions/upload-artifact@v4
        with:
          name: xADKiller-Chrome-v1.4.0-TITAN-beta-tested
          path: browser-extension/packages/*
          if-no-files-found: error
          retention-days: 30
