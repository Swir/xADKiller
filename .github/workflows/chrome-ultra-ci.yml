name: Test xADKiller Chrome TITAN

on:
  push:
    branches: [ main, chrome-titan-v140, chrome-v141-pl-en, chrome-v150-adaptive-memory ]
    paths:
      - "browser-extension/**"
      - "assets/readme/chrome/**"
      - "ci/progress_svg.py"
      - ".github/workflows/chrome-ultra-ci.yml"
  workflow_dispatch:

concurrency:
  group: xadkiller-chrome-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: SWIR progress SVG consistency
        run: python3 ../ci/progress_svg.py chrome --check
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile static dynamic session and adaptive boost rules
        run: npm run build
      - name: Validate Chrome TITAN package
        run: npm run validate
      - name: Validate v1.5 safety invariants
        run: node tools/validate-v150-safety.mjs
      - name: JavaScript syntax
        run: |
          node --check dist/chrome/service-worker.js
          node --check dist/chrome/feed-guard.js
          node --check dist/chrome/feed-health-ui.js
          node --check dist/chrome/background.js
          node --check dist/chrome/live-signatures.js
          node --check dist/chrome/titan-engine.js
          node --check dist/chrome/static-boost.js
          node --check dist/chrome/standard-core-boost.js
          node --check dist/chrome/temporary-site-guard.js
          node --check dist/chrome/titan-main.js
          node --check dist/chrome/network-scout.js
          node --check dist/chrome/early-guard.js
          node --check dist/chrome/preflight-config.js
          node --check dist/chrome/content.js
          node --check dist/chrome/shadow-sentinel.js
          node --check dist/chrome/live-cosmetic.js
          node --check dist/chrome/popup.js
          node --check dist/chrome/cosmetic-data.js
          node --check dist/chrome/build-meta.js
          node --check tests/chrome-adaptive-memory-runtime.mjs
          node --check tests/chrome-temporary-pause-runtime.mjs
          node --check tests/chrome-feed-guard-runtime.mjs
          node --check tests/chrome-blocking-benchmark.mjs
          node --check tests/chrome-shadow-mutation-soak.mjs
          node --check tests/chrome-real-page-soak.mjs
          node --check tools/validate-v150-safety.mjs
      - name: GitHub feed integrity regression test
        run: npm run test:feeds
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium TITAN runtime test
        run: timeout --signal=TERM --kill-after=10s 300s npm run test:chrome
      - name: Chromium Shadow DOM mutation soak
        run: timeout --signal=TERM --kill-after=10s 180s npm run test:shadow-soak
      - name: Chromium broader real-page soak
        run: timeout --signal=TERM --kill-after=10s 180s npm run test:real-page
      - name: Chromium adaptive static boost test
        run: timeout --signal=TERM --kill-after=10s 180s npm run test:boost
      - name: Chromium no-COMPAT regression test
        run: timeout --signal=TERM --kill-after=10s 120s npm run test:compat
      - name: Chromium PL EN language switch test
        run: timeout --signal=TERM --kill-after=10s 120s npm run test:language
      - name: Chromium Adaptive Memory persistence test
        run: timeout --signal=TERM --kill-after=10s 180s npm run test:memory
      - name: Chromium Breakage Guard pause and resume test
        run: timeout --signal=TERM --kill-after=10s 180s npm run test:pause
      - name: Chromium blocking effectiveness benchmark
        run: timeout --signal=TERM --kill-after=10s 180s npm run test:benchmark
      - name: Package Chrome TITAN Adaptive Memory ZIP
        run: |
          rm -rf packages
          mkdir -p packages
          (cd dist/chrome && zip -qr ../../packages/xADKiller-Chrome-v1.5.0-dev-Adaptive-Memory.zip .)
      - name: Checksums
        run: |
          cd packages
          sha256sum xADKiller-Chrome-v1.5.0-dev-Adaptive-Memory.zip > SHA256SUMS.txt
      - name: Verify archive
        run: |
          unzip -tq packages/xADKiller-Chrome-v1.5.0-dev-Adaptive-Memory.zip
          (cd packages && sha256sum -c SHA256SUMS.txt)
      - name: Upload tested Chrome TITAN Adaptive Memory package
        uses: actions/upload-artifact@v4
        with:
          name: xADKiller-Chrome-v1.5.0-dev-Adaptive-Memory-tested
          path: browser-extension/packages/*
          if-no-files-found: error
          retention-days: 30
