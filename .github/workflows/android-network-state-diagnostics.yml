name: xADKiller Android network-state diagnostics

on:
  workflow_dispatch:
  push:
    branches: [ android-v160-mega ]
    paths:
      - "app/src/main/java/com/swir/xadkiller/DnsPrivacyDiagnostics.java"
      - "app/src/main/java/com/swir/xadkiller/PrivateDnsHelper.java"
      - "app/src/test/java/com/swir/xadkiller/DnsPrivacyDiagnosticsTest.java"
      - ".github/workflows/android-network-state-diagnostics.yml"

concurrency:
  group: xadkiller-android-network-state-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -perm -111 | sort -V | tail -n1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Captive-portal and unvalidated-network regression
        run: gradle --no-daemon testDebugUnitTest --tests com.swir.xadkiller.DnsPrivacyDiagnosticsTest
      - name: Connectivity diagnostics contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NET_CAPABILITY_CAPTIVE_PORTAL' app/src/main/java/com/swir/xadkiller/PrivateDnsHelper.java
          grep -q 'NET_CAPABILITY_VALIDATED' app/src/main/java/com/swir/xadkiller/PrivateDnsHelper.java
          grep -q '"captive_portal"' app/src/main/java/com/swir/xadkiller/DnsPrivacyDiagnostics.java
          grep -q '"unvalidated_network"' app/src/main/java/com/swir/xadkiller/DnsPrivacyDiagnostics.java
          echo "Android network-state DNS diagnostics contract: PASS"
