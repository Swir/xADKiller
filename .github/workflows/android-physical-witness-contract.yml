name: xADKiller Android physical witness contract

on:
  workflow_dispatch:
  push:
    branches: [ android-v160-mega ]
    paths:
      - "tools/android-v160-physical-validation.sh"
      - "ci/validate_android_physical_witness.py"
      - ".github/workflows/android-physical-witness-contract.yml"

concurrency:
  group: xadkiller-android-physical-witness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  witness-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Shell syntax
        run: bash -n tools/android-v160-physical-validation.sh
      - name: Physical witness parser tamper regression
        run: python3 ci/validate_android_physical_witness.py --self-test
      - name: Safety contract
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=tools/android-v160-physical-validation.sh
          grep -q 'release_gate_closed' ci/validate_android_physical_witness.py
          grep -q 'requested_handover' "$SCRIPT"
          grep -q 'requested_package_replace' "$SCRIPT"
          grep -q 'cmd deviceidle unforce' "$SCRIPT"
          grep -q 'restore_device_state' "$SCRIPT"
          ! grep -Eq 'curl|wget|scp|rsync|http://|https://' "$SCRIPT"
          echo "Android physical witness safety contract: PASS"
