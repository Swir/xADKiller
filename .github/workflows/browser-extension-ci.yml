name: Test xADKiller Browser Extensions

on:
  push:
    branches: [ main, browser-extension-dev ]
    paths:
      - "browser-extension/**"
      - ".github/workflows/browser-extension-ci.yml"
  pull_request:
    paths:
      - "browser-extension/**"
      - ".github/workflows/browser-extension-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build browser packages
        run: npm run build
      - name: Validate manifests, locales and DNR
        run: npm run validate
      - name: JavaScript syntax
        run: |
          node --check dist/chrome/background.js
          node --check dist/chrome/content.js
          node --check dist/chrome/popup.js
          node --check dist/firefox/background.js
          node --check dist/firefox/content.js
          node --check dist/firefox/popup.js
      - name: Firefox web-ext lint
        run: npx web-ext lint --source-dir dist/firefox --warnings-as-errors
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Chromium runtime test
        run: xvfb-run -a npm run test:chrome
      - name: Package store ZIPs
        run: |
          mkdir -p packages
          (cd dist/chrome && zip -qr ../../packages/xADKiller-Chrome-v1.0.0.zip .)
          (cd dist/firefox && zip -qr ../../packages/xADKiller-Firefox-v1.0.0.zip .)
      - name: Checksums
        run: sha256sum packages/*.zip | tee packages/SHA256SUMS.txt
      - name: Upload tested packages
        uses: actions/upload-artifact@v4
        with:
          name: xADKiller-browser-v1.0.0-tested
          path: browser-extension/packages/*
          if-no-files-found: error
          retention-days: 30
