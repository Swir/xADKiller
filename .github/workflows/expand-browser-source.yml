name: Expand xADKiller Browser Source

on:
  push:
    branches: [ browser-extension-dev ]
    paths:
      - "browser-extension-source.ready"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reassemble and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat browser-extension-source.parts/part-*.b64 > /tmp/xad-browser-source.b64
          base64 -d /tmp/xad-browser-source.b64 > /tmp/xad-browser-source.zip
          echo "46b17cbc0df7c43e7e759e1ce04786827fba727114fd7ff50f65a1a3b969b197  /tmp/xad-browser-source.zip" | sha256sum -c -
          unzip -tq /tmp/xad-browser-source.zip
      - name: Expand source bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/xad-browser-src
          mkdir -p /tmp/xad-browser-src
          unzip -q /tmp/xad-browser-source.zip -d /tmp/xad-browser-src
          rm -rf browser-extension
          mkdir -p browser-extension
          cp -a /tmp/xad-browser-src/common browser-extension/
          cp -a /tmp/xad-browser-src/chrome browser-extension/
          cp -a /tmp/xad-browser-src/firefox browser-extension/
          cp -a /tmp/xad-browser-src/tools browser-extension/
          cp -a /tmp/xad-browser-src/tests browser-extension/
          cp /tmp/xad-browser-src/package.json browser-extension/package.json
          cp /tmp/xad-browser-src/README.md browser-extension/README.md
          rm -rf browser-extension-source.parts browser-extension-source.ready browser-extension-source.zip.b64
      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add xADKiller Chrome and Firefox extension sources"
          git push
