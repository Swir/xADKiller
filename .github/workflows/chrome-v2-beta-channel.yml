name: xADKiller Chrome pinned-v2 beta channel

on:
  push:
    branches: [ chrome-v150-adaptive-memory ]
    paths:
      - "browser-extension/common/feed-v2-beta-channel.js"
      - "browser-extension/common/beta-review.html"
      - "browser-extension/common/beta-review.js"
      - "browser-extension/common/service-worker.js"
      - "browser-extension/package.json"
      - "browser-extension/tests/chrome-feed-v2-beta-channel.mjs"
      - "browser-extension/tests/chrome-beta-review-contract.mjs"
      - "browser-extension/tests/chrome-blocking-benchmark.mjs"
      - "browser-extension/tests/feed-v2-consumer-compat.mjs"
      - "browser-intelligence/v2/xadkiller-live-shield.json"
      - "browser-intelligence/v2/xadkiller-live-matrix.json"
      - "browser-intelligence/v2/xadkiller-titan-feed.json"
      - ".github/workflows/chrome-v2-beta-channel.yml"
  workflow_dispatch:

concurrency:
  group: xadkiller-chrome-v2-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install pinned test dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: SWIR progress SVG consistency
        run: python3 ../ci/progress_svg.py chrome --check
      - name: JavaScript syntax
        run: |
          node --check common/feed-v2-beta-channel.js
          node --check common/beta-review.js
          node --check tests/chrome-feed-v2-beta-channel.mjs
          node --check tests/chrome-beta-review-contract.mjs
          node --check tests/chrome-blocking-benchmark.mjs
          node --check tests/feed-v2-consumer-compat.mjs
      - name: Pinned feed-v2 exact-byte routing contract
        run: node tests/chrome-feed-v2-beta-channel.mjs
      - name: Feed-v2 compatibility import-order regression
        run: node tests/feed-v2-consumer-compat.mjs
      - name: Local beta review privacy and PL-EN contract
        run: node tests/chrome-beta-review-contract.mjs
      - name: Deterministic STANDARD ULTRA and benign blocking benchmark
        run: node tests/chrome-blocking-benchmark.mjs
      - name: Pinned candidate integrity metadata contract
        run: |
          grep -q 'blobSha1:"1e2931556cd6d888fd50da92d04266512a213fc7"' common/feed-v2-beta-channel.js
          grep -q 'blobSha1:"a10298b6d9004f0466bee6d601efce77d1a439a8"' common/feed-v2-beta-channel.js
          grep -q 'blobSha1:"ea60aa6a868b65b05f1554b89a5db3fa12d50214"' common/feed-v2-beta-channel.js
          grep -q 'crypto.subtle.digest("SHA-1"' common/feed-v2-beta-channel.js
          echo "Pinned v2 Git-blob integrity metadata: PASS"
      - name: No remote executable code in beta channel
        run: |
          ! grep -Eq '\beval\s*\(|new[[:space:]]+Function|WebAssembly|importScripts\([^"[:space:]]' common/feed-v2-beta-channel.js
          grep -q 'release_gate_closed:false' common/beta-review.js
          grep -q 'Return to production v1' common/beta-review.html
          echo "Pinned-v2 beta channel safety contract: PASS"
