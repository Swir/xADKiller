name: Build xADKiller APK

on:
  workflow_dispatch:
  push:
    branches: [ main, android-v160-mega ]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "ci/**"
      - "assets/readme/android/**"
      - "README.md"
      - "ANDROID_V160_ROADMAP.md"
      - ".github/workflows/build-apk.yml"

concurrency:
  group: xadkiller-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -perm -111 | sort -V | tail -n1)"
          fi
          test -n "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Stable test signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d ci/xadkiller-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: SWIR progress SVG consistency
        run: python3 ci/progress_svg.py android --check
      - name: Android privacy and network manifest gate
        run: |
          set -euo pipefail
          MANIFEST=app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"
          grep -q 'android:networkSecurityConfig="@xml/network_security_config"' "$MANIFEST"
          grep -q 'android:permission="android.permission.BIND_VPN_SERVICE"' "$MANIFEST"
          ! grep -q 'android.permission.QUERY_ALL_PACKAGES' "$MANIFEST"
          echo "Android privacy manifest gate: PASS"
      - name: Android lint
        run: gradle --no-daemon lintDebug
      - name: Unit tests DNS query EDNS response framing lifecycle and blocking benchmark
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Validate APK package
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/xadkiller-badging.txt
          grep -q "package: name='com.swir.xadkiller.debug'" /tmp/xadkiller-badging.txt
          grep -q "sdkVersion:'26'" /tmp/xadkiller-badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/xadkiller-badging.txt
      - name: APK checksum
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/xADKiller-Android-v1.6.0-dev-debug.apk
          (cd artifacts && sha256sum xADKiller-Android-v1.6.0-dev-debug.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Upload tested development APK
        uses: actions/upload-artifact@v4
        with:
          name: xADKiller-Android-v1.6.0-dev-tested
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
