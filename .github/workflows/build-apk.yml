name: Build xADKiller APK

on:
  workflow_dispatch:
  push:
    branches: [ main, android-v160-mega ]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "ci/**"
      - "ANDROID_V160_ROADMAP.md"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Stable test signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d ci/xadkiller-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Android lint
        run: gradle --no-daemon lintDebug
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Validate APK package
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/xadkiller-badging.txt
          grep -q "package: name='com.swir.xadkiller.debug'" /tmp/xadkiller-badging.txt
          grep -q "sdkVersion:'26'" /tmp/xadkiller-badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/xadkiller-badging.txt
      - name: APK checksum
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/xADKiller-Android-dev-debug.apk
          (cd artifacts && sha256sum xADKiller-Android-dev-debug.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xADKiller-Android-dev-tested
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
