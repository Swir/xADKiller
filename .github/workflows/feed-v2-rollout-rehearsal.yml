name: xADKiller feed v2 rollout rehearsal

on:
  workflow_dispatch:
  push:
    branches: [ chrome-v150-adaptive-memory ]
    paths:
      - "browser-extension/tools/feed-v2-migration-preflight.mjs"
      - "browser-extension/tools/validate-feed-v2-candidate-artifacts.mjs"
      - "browser-extension/tools/feed-v2-rollout-plan.mjs"
      - "browser-extension/tools/validate-feed-v2-rollout-plan.mjs"
      - "browser-extension/tests/feed-v2-rollout-plan-contract.mjs"
      - "browser-intelligence/feed-checksums.json"
      - "browser-intelligence/feed-v2-migration-plan.json"
      - ".github/workflows/feed-v2-rollout-rehearsal.yml"

concurrency:
  group: xadkiller-feed-v2-rollout-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Syntax check rollout tooling
        run: |
          node --check tools/feed-v2-rollout-plan.mjs
          node --check tools/validate-feed-v2-rollout-plan.mjs
          node --check tests/feed-v2-rollout-plan-contract.mjs
      - name: Rebuild deterministic schema-v2 candidates from pinned production data
        run: node tools/feed-v2-migration-preflight.mjs --write
      - name: Validate candidate artifact manifest
        run: node tools/validate-feed-v2-candidate-artifacts.mjs
      - name: Build unauthorized data-only rollout rehearsal plan
        run: node tools/feed-v2-rollout-plan.mjs
      - name: Validate optimistic-concurrency rollback and post-publish fingerprints
        run: node tools/validate-feed-v2-rollout-plan.mjs
      - name: Tamper regression for rollout safety contract
        run: node tests/feed-v2-rollout-plan-contract.mjs
      - name: Upload verified rehearsal bundle
        uses: actions/upload-artifact@v4
        with:
          name: xADKiller-feed-v2-rollout-rehearsal
          path: browser-extension/packages/feed-v2-candidates/*
          if-no-files-found: error
          retention-days: 14
